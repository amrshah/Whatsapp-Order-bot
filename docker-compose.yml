networks:
  alamia-network:
    external: true

services:
  app:
    build: .
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=alamia_os
      - DB_USERNAME=alamia
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
      # Add other important env vars here (APP_KEY, etc.)
    networks:
      - alamia-network
    restart: unless-stopped
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=alamia_os
      - DB_USERNAME=alamia
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
    networks:
      - alamia-network
    restart: unless-stopped
    depends_on:
      - db
      - redis

  cron:
    build: .
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=alamia_os
      - DB_USERNAME=alamia
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
    networks:
      - alamia-network
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alamia_os
      POSTGRES_USER: alamia
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - alamia-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - alamia-network
    restart: unless-stopped



volumes:
  db-data:
